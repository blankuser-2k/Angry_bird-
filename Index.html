<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angry Birds Clone</title>
  <style>
    :root {
      --sky-top: #8ad4ff;
      --sky-bottom: #d9f5ff;
      --ground: #7fc75f;
      --wood: #b66a2c;
      --wood-dark: #8f4e1d;
      --glass: #8ad8ff;
      --pig: #6ecf4a;
      --pig-dark: #3f8a2d;
      --bird: #ef5a4e;
      --bird-dark: #c3382d;
      --slingshot: #5b3b1a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: linear-gradient(#8ad4ff, #d9f5ff);
      font-family: Arial, sans-serif;
      color: #123;
    }

    #game-wrap {
      position: relative;
      width: min(96vw, 960px);
      height: min(75vw, 576px);
      max-height: 576px;
      border: 6px solid #6a4a2b;
      border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.25);
      background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      font-weight: bold;
      color: #0f2f3d;
      text-shadow: 0 2px 0 rgba(255,255,255,0.65);
      font-size: 18px;
      pointer-events: none;
      user-select: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(17, 26, 32, 0.4);
      color: white;
      font-size: clamp(32px, 4vw, 56px);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.35);
      z-index: 10;
    }

    .overlay.visible { display: flex; }

    .instructions {
      position: absolute;
      right: 14px;
      bottom: 12px;
      font-size: 14px;
      color: #234;
      background: rgba(255,255,255,0.3);
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.08);
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <div class="hud">Score: <span id="score">0</span></div>
    <div id="overlay" class="overlay">Level Clear!</div>
    <div class="instructions">Drag the bird. Release to fire. Press R to restart.</div>
    <canvas id="game" width="960" height="576"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const overlayEl = document.getElementById("overlay");

    const WORLD = {
      gravity: 0.22,
      slingX: 160,
      slingY: 390,
      maxPull: 100,
      birdRadius: 18
    };

    const state = {
      score: 0,
      level: 1,
      gameOver: false,
      dragging: false,
      birdIndex: 0,
      birds: [],
      pigs: [],
      blocks: [],
      pointer: { x: 0, y: 0 }
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function addScore(amount) {
      state.score += amount;
      scoreEl.textContent = state.score;
    }

    function makeBird(x = WORLD.slingX, y = WORLD.slingY) {
      return {
        x, y,
        radius: WORLD.birdRadius,
        vx: 0,
        vy: 0,
        launched: false,
        used: false,
        ready: true
      };
    }

    function makePig(x, y) {
      return {
        x, y,
        w: 36,
        h: 30,
        hp: 1
      };
    }

    function makeBlock(x, y, w, h, material = "wood") {
      return {
        x, y, w, h,
        hp: material === "stone" ? 5 : 2,
        material
      };
    }

    function buildLevel() {
      state.pigs = [
        makePig(720, 470),
        makePig(820, 470),
        makePig(770, 420)
      ];

      state.blocks = [
        makeBlock(690, 460, 20, 80, "wood"),
        makeBlock(850, 460, 20, 80, "wood"),
        makeBlock(770, 385, 20, 90, "wood"),
        makeBlock(730, 340, 90, 18, "stone"),
        makeBlock(810, 340, 90, 18, "stone"),
        makeBlock(770, 300, 18, 90, "stone")
      ];
    }

    function resetGame() {
      state.birds = [makeBird(), makeBird(), makeBird()];
      state.birdIndex = 0;
      state.score = 0;
      scoreEl.textContent = state.score;
      overlayEl.classList.remove("visible");
      overlayEl.textContent = "Level Clear!";
      state.gameOver = false;
      buildLevel();
    }

    function getActiveBird() {
      return state.birds[state.birdIndex] || null;
    }

    function nextBird() {
      state.birdIndex += 1;
      const bird = getActiveBird();
      if (!bird) {
        if (state.pigs.length > 0) {
          overlayEl.textContent = "Try Again!";
          overlayEl.classList.add("visible");
          state.gameOver = true;
        } else {
          overlayEl.textContent = "Level Clear!";
          overlayEl.classList.add("visible");
          state.gameOver = true;
        }
        return;
      }

      bird.x = WORLD.slingX;
      bird.y = WORLD.slingY;
      bird.vx = 0;
      bird.vy = 0;
      bird.launched = false;
      bird.ready = true;
    }

    function launchBird() {
      const bird = getActiveBird();
      if (!bird || bird.launched || state.gameOver) return;

      const dx = bird.x - WORLD.slingX;
      const dy = bird.y - WORLD.slingY;

      bird.vx = (dx * 0.12);
      bird.vy = (dy * 0.12);

      bird.launched = true;
      bird.used = true;
      bird.ready = false;

      bird.x += bird.vx * 0.8;
      bird.y += bird.vy * 0.8;
    }

    function circleRectCollision(cx, cy, r, rect) {
      const nearestX = clamp(cx, rect.x, rect.x + rect.w);
      const nearestY = clamp(cy, rect.y, rect.y + rect.h);
      const dx = cx - nearestX;
      const dy = cy - nearestY;
      return (dx * dx + dy * dy) <= (r * r);
    }

    function resolveBirdBlockCollision(bird, block) {
      const closestX = clamp(bird.x, block.x, block.x + block.w);
      const closestY = clamp(bird.y, block.y, block.y + block.h);

      const dx = bird.x - closestX;
      const dy = bird.y - closestY;
      const distSq = dx * dx + dy * dy;

      if (distSq < bird.radius * bird.radius) {
        const dist = Math.sqrt(distSq) || 0.001;
        const nx = dx / dist;
        const ny = dy / dist;

        const overlap = bird.radius - dist;
        bird.x += nx * (overlap + 0.5);
        bird.y += ny * (overlap + 0.5);

        const impact = Math.hypot(bird.vx, bird.vy);
        bird.vx += nx * impact * 0.18;
        bird.vy += ny * impact * 0.18;

        block.hp -= 1;
        addScore(10);

        if (block.hp <= 0) {
          const index = state.blocks.indexOf(block);
          if (index >= 0) state.blocks.splice(index, 1);
        }
      }
    }

    function resolveBirdPigCollision(bird, pig) {
      const closestX = clamp(bird.x, pig.x - pig.w / 2, pig.x + pig.w / 2);
      const closestY = clamp(bird.y, pig.y - pig.h / 2, pig.y + pig.h / 2);
      const dx = bird.x - closestX;
      const dy = bird.y - closestY;
      const distSq = dx * dx + dy * dy;

      if (distSq < bird.radius * bird.radius) {
        const dist = Math.sqrt(distSq) || 0.001;
        const nx = dx / dist;
        const ny = dy / dist;

        const overlap = bird.radius - dist;
        bird.x += nx * (overlap + 0.6);
        bird.y += ny * (overlap + 0.6);

        const impact = Math.hypot(bird.vx, bird.vy);
        bird.vx += nx * impact * 0.22;
        bird.vy += ny * impact * 0.22;

        pig.hp -= 1;
        addScore(75);

        if (pig.hp <= 0) {
          const index = state.pigs.indexOf(pig);
          if (index >= 0) state.pigs.splice(index, 1);
        }
      }
    }
