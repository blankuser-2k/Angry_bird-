/* =====================================================
   HELPER FUNCTIONS
===================================================== */

function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(max,value)
  );

}


function distance(x1,y1,x2,y2){

  return Math.hypot(
    x2-x1,
    y2-y1
  );

}


function addScore(points){

  game.score += points;

  scoreText.textContent =
    game.score;

}


/* =====================================================
   CREATE BIRD
===================================================== */

function createBird(type){

  return {

    type:type,

    x:WORLD.slingX,

    y:WORLD.slingY,

    radius:WORLD.birdRadius,

    vx:0,

    vy:0,

    launched:false,

    used:false,

    abilityUsed:false,

    alive:true

  };

}


/* =====================================================
   CREATE PIG
===================================================== */

function createPig(x,y){

  return {

    x:x,

    y:y,

    w:38,

    h:32,

    hp:1,

    alive:true

  };

}


/* =====================================================
   CREATE BLOCK
===================================================== */

function createBlock(
  x,y,w,h,material
){

  return {

    x:x,

    y:y,

    w:w,

    h:h,

    material:material,

    hp:
      material==="stone"
      ? 4
      : 2

  };

}


/* =====================================================
   LOAD LEVEL
===================================================== */

function loadLevel(levelNumber){

  const data =
    LEVELS[levelNumber-1];

  game.level =
    levelNumber;

  game.birds =
    data.birds.map(
      type => createBird(type)
    );

  game.birdIndex = 0;

  /* CLEAR EXTRA BLUE BIRDS */
  game.abilityBirds = [];

  game.pigs =
    data.pigs.map(
      p => createPig(p[0],p[1])
    );

  game.blocks =
    data.blocks.map(
      b => createBlock(
        b[0],
        b[1],
        b[2],
        b[3],
        b[4]
      )
    );

  game.dragging = false;

  game.gameOver = false;

  game.levelChanging = false;

  levelText.textContent =
    levelNumber;

  updateBirdInfo();

  hideMessage();

}


/* =====================================================
   CURRENT BIRD
===================================================== */

function getBird(){

  return game.birds[
    game.birdIndex
  ] || null;

}


function updateBirdInfo(){

  const bird =
    getBird();

  if(!bird){

    birdNameText.textContent =
      "-";

    return;

  }

  birdNameText.textContent =
    BIRD_TYPES[bird.type].name;

}


/* =====================================================
   RESET BIRD POSITION
===================================================== */

function resetCurrentBird(){

  const bird =
    getBird();

  if(!bird) return;

  bird.x =
    WORLD.slingX;

  bird.y =
    WORLD.slingY;

  bird.vx=0;

  bird.vy=0;

  bird.launched=false;

  bird.used=false;

  bird.abilityUsed=false;

  bird.alive=true;

}


/* =====================================================
   NEXT BIRD
===================================================== */

function nextBird(){

  if(game.gameOver) return;

  game.birdIndex++;

  if(
    game.birdIndex >=
    game.birds.length
  ){

    loseGame();

    return;

  }

  resetCurrentBird();

  updateBirdInfo();

}


/* =====================================================
   WIN
===================================================== */

function winLevel(){

  if(game.gameOver) return;

  game.gameOver=true;

  game.levelChanging=true;

  if(game.level >= 10){

    showMessage(
      "നീ ഒരു ഭയകരൻ തന്നെ",
      "All 10 levels completed! 🏆",
      "Play Again"
    );

    messageButton.onclick =
      function(){

        game.score=0;

        scoreText.textContent=0;

        loadLevel(1);

      };

  }
  else{

    showMessage(
      "അടുത്തത് നോക്ക് മച്ചു",
      "Level "+game.level+
      " completed! 🔥",
      "Next Level"
    );

    messageButton.onclick =
      function(){

        loadLevel(
          game.level+1
        );

      };

  }

}


/* =====================================================
   LOSE
===================================================== */

function loseGame(){

  game.gameOver=true;

  showMessage(
    "വേല്ല പണിക്കും പോടാ",
    "Try the level again 😂",
    "Retry"
  );

  messageButton.onclick =
    function(){

      loadLevel(
        game.level
      );

    };

}


/* =====================================================
   MESSAGE BOX
===================================================== */

function showMessage(
  main,
  sub,
  button
){

  subMessage.textContent =
    sub;

  messageButton.textContent =
    button;

  messageBox.classList.add(
    "show"
  );

}


function hideMessage(){

  messageBox.classList.remove(
    "show"
  );

}


/* =====================================================
   COLLISION HELPER
===================================================== */

function circleRectCollision(
  cx,cy,r,rect
){

  const closestX =
    clamp(
      cx,
      rect.x,
      rect.x+rect.w
    );

  const closestY =
    clamp(
      cy,
      rect.y,
      rect.y+rect.h
    );

  const dx =
    cx-closestX;

  const dy =
    cy-closestY;

  return(
    dx*dx+
    dy*dy
    <=
    r*r
  );

}


/* =====================================================
   BIRD-BLOCK COLLISION
===================================================== */

function hitBlock(
  bird,
  block
){

  if(
    !circleRectCollision(
      bird.x,
      bird.y,
      bird.radius,
      block
    )
  ){

    return false;

  }


  const speed =
    Math.hypot(
      bird.vx,
      bird.vy
    );


  let damage=1;


  if(speed>12)
    damage=3;

  else if(speed>7)
    damage=2;


  block.hp -= damage;

  addScore(10);


  if(block.hp<=0){

    const index =
      game.blocks.indexOf(
        block
      );

    if(index>=0){

      game.blocks.splice(
        index,
        1
      );

      addScore(20);

    }

  }


  bird.vx *= -.45;

  bird.vy *= -.45;


  return true;

}


/* =====================================================
   BIRD-PIG COLLISION
===================================================== */

function hitPig(
  bird,
  pig
){

  if(
    !circleRectCollision(
      bird.x,
      bird.y,
      bird.radius,
      {
        x:pig.x-pig.w/2,
        y:pig.y-pig.h/2,
        w:pig.w,
        h:pig.h
      }
    )
  ){

    return false;

  }


  pig.hp=0;

  pig.alive=false;

  addScore(100);


  const index =
    game.pigs.indexOf(
      pig
    );


  if(index>=0){

    game.pigs.splice(
      index,
      1
    );

  }


  bird.vx *= .5;

  bird.vy *= .5;


  return true;

}/* =====================================================
   BIRD ABILITIES
===================================================== */

function useBirdAbility(){

  const bird =
    getBird();


  if(
    !bird ||
    !bird.launched ||
    bird.abilityUsed ||
    game.gameOver
  ){

    return;

  }


  bird.abilityUsed=true;


  /* =========================
     YELLOW - SPEED BOOST
  ========================= */

  if(bird.type==="yellow"){

    const speed =
      Math.hypot(
        bird.vx,
        bird.vy
      );

    if(speed>0){

      bird.vx *= 2;

      bird.vy *= 2;

    }

  }


  /* =========================
     BLUE - TRIPLE SPLIT
  ========================= */

  else if(bird.type==="blue"){

    const speed =
      Math.max(
        7,
        Math.hypot(
          bird.vx,
          bird.vy
        )
      );


    const baseAngle =
      Math.atan2(
        bird.vy,
        bird.vx
      );


    const angles=[
      -0.45,
      0.45
    ];


    for(
      let i=0;
      i<angles.length;
      i++
    ){

      const newBird =
        createBird("blue");


      newBird.x =
        bird.x;

      newBird.y =
        bird.y;


      const angle =
        baseAngle+
        angles[i];


      newBird.vx =
        Math.cos(angle)*
        speed;

      newBird.vy =
        Math.sin(angle)*
        speed;


      newBird.launched=true;

      newBird.used=true;

      newBird.abilityUsed=true;

      newBird.alive=true;


      game.abilityBirds.push(
        newBird
      );

    }

  }


  /* =========================
     BLACK - EXPLOSION
  ========================= */

  else if(bird.type==="black"){

    const explosionRadius=115;


    /* Destroy nearby pigs */

    for(
      const pig
      of [...game.pigs]
    ){

      if(
        distance(
          bird.x,
          bird.y,
          pig.x,
          pig.y
        )
        <
        explosionRadius
      ){

        pig.hp=0;

        pig.alive=false;


        const index =
          game.pigs.indexOf(
            pig
          );


        if(index>=0){

          game.pigs.splice(
            index,
            1
          );

          addScore(100);

        }

      }

    }


    /* Destroy nearby blocks */

    for(
      const block
      of [...game.blocks]
    ){

      if(
        distance(
          bird.x,
          bird.y,
          block.x+
          block.w/2,
          block.y+
          block.h/2
        )
        <
        explosionRadius
      ){

        const index =
          game.blocks.indexOf(
            block
          );


        if(index>=0){

          game.blocks.splice(
            index,
            1
          );

          addScore(30);

        }

      }

    }


    bird.vx=0;

    bird.vy=0;

  }

}


/* =====================================================
   UPDATE EXTRA ABILITY BIRDS
===================================================== */

function updateAbilityBirds(){

  for(
    const bird
    of [...game.abilityBirds]
  ){

    bird.vy +=
      WORLD.gravity;


    bird.x +=
      bird.vx;

    bird.y +=
      bird.vy;


    bird.vx *=
      .998;

    bird.vy *=
      .998;


    /* Block collision */

    for(
      const block
      of [...game.blocks]
    ){

      hitBlock(
        bird,
        block
      );

    }


    /* Pig collision */

    for(
      const pig
      of [...game.pigs]
    ){

      hitPig(
        bird,
        pig
      );

    }


    /* Ground */

    if(
      bird.y+
      bird.radius
      >
      WORLD.groundY
    ){

      bird.y =
        WORLD.groundY-
        bird.radius;

      bird.vy *=
        -.35;

      bird.vx *=
        .70;

    }


    /* Remove when far outside */

    if(
      bird.x<
        -150 ||
      bird.x>
        WORLD.width+150 ||
      bird.y>
        WORLD.height+150
    ){

      const index =
        game.abilityBirds.indexOf(
          bird
        );


      if(index>=0){

        game.abilityBirds.splice(
          index,
          1
        );

      }

    }

  }

}


/* =====================================================
   UPDATE BIRD
===================================================== */

function updateBird(){

  const bird =
    getBird();

  if(!bird) return;


  /* Bird waiting on slingshot */

  if(!bird.launched){

    if(game.dragging){

      let dx =
        game.pointer.x-
        WORLD.slingX;

      let dy =
        game.pointer.y-
        WORLD.slingY;


      const d =
        Math.hypot(
          dx,
          dy
        );


      if(
        d>WORLD.maxPull
      ){

        dx =
          dx/d*
          WORLD.maxPull;

        dy =
          dy/d*
          WORLD.maxPull;

      }


      bird.x =
        WORLD.slingX+
        dx;

      bird.y =
        WORLD.slingY+
        dy;

    }
    else{

      bird.x =
        WORLD.slingX;

      bird.y =
        WORLD.slingY;

    }

    return;

  }


  /* Gravity */

  bird.vy +=
    WORLD.gravity;


  /* Movement */

  bird.x +=
    bird.vx;

  bird.y +=
    bird.vy;


  /* Air resistance */

  bird.vx *=
    .998;

  bird.vy *=
    .998;


  /* Block collision */

  for(
    const block
    of [...game.blocks]
  ){

    hitBlock(
      bird,
      block
    );

  }


  /* Pig collision */

  for(
    const pig
    of [...game.pigs]
  ){

    hitPig(
      bird,
      pig
    );

  }


  /* Ground */

  if(
    bird.y+
    bird.radius
    >
    WORLD.groundY
  ){

    bird.y =
      WORLD.groundY-
      bird.radius;

    bird.vy *=
      -.35;

    bird.vx *=
      .70;

  }


  /* Out of screen */

  if(
    bird.x<
      -150 ||
    bird.x>
      WORLD.width+150 ||
    bird.y>
      WORLD.height+150
  ){

    nextBird();

    return;

  }


  /* Bird stopped */

  const speed =
    Math.hypot(
      bird.vx,
      bird.vy
    );


  if(
    speed<.35 &&
    bird.y+
    bird.radius
    >=
    WORLD.groundY-2
  ){

    bird.vx=0;

    bird.vy=0;

    setTimeout(
      function(){

        if(
          !game.gameOver &&
          getBird()===bird
        ){

          nextBird();

        }

      },
      500
    );

  }

}


/* =====================================================
   SLINGSHOT
===================================================== */

function drawSlingshot(){

  const x =
    WORLD.slingX;

  const y =
    WORLD.slingY;


  ctx.lineCap=
    "round";


  /* Wood */

  ctx.strokeStyle=
    "#603b18";

  ctx.lineWidth=12;


  ctx.beginPath();

  ctx.moveTo(
    x-18,
    y+75
  );

  ctx.lineTo(
    x-7,
    y-18
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x+18,
    y+75
  );

  ctx.lineTo(
    x+7,
    y-18
  );

  ctx.stroke();


  /* Rubber */

  const bird =
    getBird();


  if(
    bird &&
    !bird.launched
  ){

    ctx.strokeStyle=
      "#25170d";

    ctx.lineWidth=5;


    ctx.beginPath();

    ctx.moveTo(
      x-7,
      y-18
    );

    ctx.lineTo(
      bird.x,
      bird.y
    );

    ctx.lineTo(
      x+7,
      y-18
    );

    ctx.stroke();

  }

}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground(){

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      WORLD.height
    );


  gradient.addColorStop(
    0,
    "#72cfff"
  );

  gradient.addColorStop(
    1,
    "#dff7ff"
  );


  ctx.fillStyle=
    gradient;

  ctx.fillRect(
    0,
    0,
    WORLD.width,
    WORLD.height
  );


  /* Clouds */

  drawCloud(
    180,
    100,
    1
  );

  drawCloud(
    470,
    75,
    .8
  );

  drawCloud(
    780,
    120,
    1.1
  );


  /* Ground */

  ctx.fillStyle=
    "#79c95b";

  ctx.fillRect(
    0,
    WORLD.groundY,
    WORLD.width,
    WORLD.height-
    WORLD.groundY
  );


  ctx.fillStyle=
    "#4f9b38";

  ctx.fillRect(
    0,
    WORLD.groundY,
    WORLD.width,
    6
  );

}


function drawCloud(
  x,
  y,
  scale
){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    scale,
    scale
  );


  ctx.fillStyle=
    "rgba(255,255,255,.75)";


  ctx.beginPath();

  ctx.arc(
    0,
    15,
    25,
    0,
    Math.PI*2
  );

  ctx.arc(
    30,
    5,
    35,
    0,
    Math.PI*2
  );

  ctx.arc(
    65,
    15,
    25,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* =====================================================
   DRAW BIRD
===================================================== */

function drawBird(
  bird
){

  ctx.save();

  ctx.translate(
    bird.x,
    bird.y
  );


  const type =
    BIRD_TYPES[
      bird.type
    ];


  /* Body */

  ctx.fillStyle=
    type.color;


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    bird.radius,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Belly */

  ctx.fillStyle=
    "rgba(255,255,255,.18)";

  ctx.beginPath();

  ctx.arc(
    -3,
    5,
    10,
    0,
    Math.PI
  );

  ctx.fill();


  /* Eyes */

  ctx.fillStyle=
    "white";


  ctx.beginPath();

  ctx.arc(
    -6,
    -5,
    5,
    0,
    Math.PI*2
  );

  ctx.arc(
    6,
    -5,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle=
    "black";


  ctx.beginPath();

  ctx.arc(
    -5,
    -5,
    2,
    0,
    Math.PI*2
  );

  ctx.arc(
    5,
    -5,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Beak */

  ctx.fillStyle=
    "#f2a51c";


  ctx.beginPath();

  ctx.moveTo(
    15,
    0
  );

  ctx.lineTo(
    30,
    6
  );

  ctx.lineTo(
    15,
    12
  );

  ctx.closePath();

  ctx.fill();


  /* Angry eyebrows */

  ctx.strokeStyle=
    "#351b15";

  ctx.lineWidth=4;


  ctx.beginPath();

  ctx.moveTo(
    -13,
    -12
  );

  ctx.lineTo(
    -2,
    -9
  );

  ctx.moveTo(
    2,
    -9
  );

  ctx.lineTo(
    13,
    -12
  );

  ctx.stroke();


  /* Black bird fuse */

  if(
    bird.type==="black"
  ){

    ctx.strokeStyle=
      "#222";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
      -5,
      -18
    );

    ctx.lineTo(
      0,
      -27
    );

    ctx.stroke();

  }


  ctx.restore();

      }/* =====================================================
   DRAW PIG
===================================================== */

function drawPig(
  pig
){

  ctx.save();

  ctx.translate(
    pig.x,
    pig.y
  );


  /* Body */

  ctx.fillStyle=
    "#69c94a";


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    19,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Ears */

  ctx.fillStyle=
    "#3f8d2e";


  ctx.beginPath();

  ctx.arc(
    -11,
    -15,
    7,
    0,
    Math.PI*2
  );

  ctx.arc(
    11,
    -15,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Eyes */

  ctx.fillStyle=
    "white";


  ctx.beginPath();

  ctx.arc(
    -6,
    -5,
    5,
    0,
    Math.PI*2
  );

  ctx.arc(
    6,
    -5,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle=
    "black";


  ctx.beginPath();

  ctx.arc(
    -6,
    -5,
    2,
    0,
    Math.PI*2
  );

  ctx.arc(
    6,
    -5,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Nose */

  ctx.fillStyle=
    "#4b9d35";


  ctx.beginPath();

  ctx.ellipse(
    0,
    7,
    9,
    6,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle=
    "#214f1c";


  ctx.beginPath();

  ctx.arc(
    -4,
    7,
    2,
    0,
    Math.PI*2
  );

  ctx.arc(
    4,
    7,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();

}


/* =====================================================
   DRAW BLOCK
===================================================== */

function drawBlock(
  block
){

  if(
    block.material==="wood"
  ){

    ctx.fillStyle=
      "#b66a2c";

    ctx.strokeStyle=
      "#7d431a";

  }
  else{

    ctx.fillStyle=
      "#888";

    ctx.strokeStyle=
      "#555";

  }


  ctx.fillRect(
    block.x,
    block.y,
    block.w,
    block.h
  );


  ctx.lineWidth=3;


  ctx.strokeRect(
    block.x,
    block.y,
    block.w,
    block.h
  );


  /* Damage lines */

  if(
    block.hp<=1
  ){

    ctx.strokeStyle=
      "rgba(0,0,0,.5)";

    ctx.lineWidth=2;


    ctx.beginPath();

    ctx.moveTo(
      block.x+4,
      block.y+4
    );

    ctx.lineTo(
      block.x+
      block.w-4,
      block.y+
      block.h-4
    );

    ctx.stroke();

  }

}


/* =====================================================
   TRAJECTORY
===================================================== */

function drawTrajectory(){

  const bird =
    getBird();


  if(
    !bird ||
    bird.launched ||
    !game.dragging
  ){

    return;

  }


  const dx =
    bird.x-
    WORLD.slingX;

  const dy =
    bird.y-
    WORLD.slingY;


  const vx =
    dx*.12;

  const vy =
    dy*.12;


  ctx.fillStyle=
    "rgba(40,40,40,.35)";


  for(
    let i=1;
    i<=12;
    i++
  ){

    const t =
      i*5;


    const px =
      WORLD.slingX+
      vx*t;


    const py =
      WORLD.slingY+
      vy*t+
      .5*
      WORLD.gravity*
      t*t;


    ctx.beginPath();

    ctx.arc(
      px,
      py,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =====================================================
   DRAW REMAINING BIRDS
===================================================== */

function drawRemainingBirds(){

  let count=0;


  for(
    let i=game.birdIndex+1;
    i<game.birds.length;
    i++
  ){

    const bird =
      game.birds[i];


    if(
      bird.used
    ){

      continue;

    }


    const x =
      75+
      count*45;

    const y =
      490;


    drawBird({

      x:x,

      y:y,

      radius:14,

      type:bird.type

    });


    count++;

  }

}


/* =====================================================
   DRAW EVERYTHING
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    WORLD.width,
    WORLD.height
  );


  drawBackground();


  /* Blocks */

  for(
    const block
    of game.blocks
  ){

    drawBlock(
      block
    );

  }


  /* Pigs */

  for(
    const pig
    of game.pigs
  ){

    drawPig(
      pig
    );

  }


  drawTrajectory();


  drawSlingshot();


  /* Active bird */

  const bird =
    getBird();


  if(bird){

    drawBird(
      bird
    );

  }


  /* EXTRA BLUE SPLIT BIRDS */

  for(
    const splitBird
    of game.abilityBirds
  ){

    drawBird(
      splitBird
    );

  }


  drawRemainingBirds();

}


/* =====================================================
   LAUNCH BIRD
===================================================== */

function launchBird(){

  const bird =
    getBird();


  if(
    !bird ||
    bird.launched ||
    game.gameOver
  ){

    return;

  }


  const dx =
    bird.x-
    WORLD.slingX;

  const dy =
    bird.y-
    WORLD.slingY;


  /* Don't launch if barely pulled */

  if(
    Math.hypot(
      dx,
      dy
    )<8
  ){

    resetCurrentBird();

    return;

  }


  bird.vx =
    dx*.12;

  bird.vy =
    dy*.12;


  bird.launched=true;

  bird.used=true;

  bird.alive=true;


  /* Small initial movement */

  bird.x +=
    bird.vx*.4;

  bird.y +=
    bird.vy*.4;

}


/* =====================================================
   POINTER POSITION
===================================================== */

function updatePointer(
  event
){

  const rect =
    canvas.getBoundingClientRect();


  game.pointer.x =
    (
      event.clientX-
      rect.left
    )*
    (
      WORLD.width/
      rect.width
    );


  game.pointer.y =
    (
      event.clientY-
      rect.top
    )*
    (
      WORLD.height/
      rect.height
    );


  game.pointer.x =
    clamp(
      game.pointer.x,
      0,
      WORLD.width
    );


  game.pointer.y =
    clamp(
      game.pointer.y,
      0,
      WORLD.height
    );

}


/* =====================================================
   POINTER DOWN
===================================================== */

canvas.addEventListener(
  "pointerdown",
  function(event){

    if(game.gameOver)
      return;


    event.preventDefault();


    updatePointer(
      event
    );


    const bird =
      getBird();


    /* ==============================================
       IMPORTANT:
       IF BIRD IS ALREADY FLYING,
       TAP/CLICK = USE ABILITY
    ============================================== */

    if(
      bird &&
      bird.launched
    ){

      useBirdAbility();

      return;

    }


    if(!bird){

      return;

    }


    const d =
      distance(
        game.pointer.x,
        game.pointer.y,
        bird.x,
        bird.y
      );


    if(d<50){

      game.dragging=true;

      game.pointerId=
        event.pointerId;


      canvas.setPointerCapture(
        event.pointerId
      );

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   POINTER MOVE
===================================================== */

canvas.addEventListener(
  "pointermove",
  function(event){

    event.preventDefault();


    updatePointer(
      event
    );


    if(
      game.dragging &&
      (
        game.pointerId===
        event.pointerId
      )
    ){

      const bird =
        getBird();


      if(!bird) return;


      let dx =
        game.pointer.x-
        WORLD.slingX;

      let dy =
        game.pointer.y-
        WORLD.slingY;


      const d =
        Math.hypot(
          dx,
          dy
        );


      if(
        d>WORLD.maxPull
      ){

        dx =
          dx/d*
          WORLD.maxPull;

        dy =
          dy/d*
          WORLD.maxPull;

      }


      bird.x =
        WORLD.slingX+
        dx;

      bird.y =
        WORLD.slingY+
        dy;

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   POINTER UP
===================================================== */

canvas.addEventListener(
  "pointerup",
  function(event){

    event.preventDefault();


    if(
      !game.dragging
    ){

      return;

    }


    if(
      game.pointerId===
      event.pointerId
    ){

      updatePointer(
        event
      );


      game.dragging=false;

      game.pointerId=null;


      try{

        canvas.releasePointerCapture(
          event.pointerId
        );

      }
      catch(e){}


      /* IMPORTANT:
         Launch immediately */

      launchBird();

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   POINTER CANCEL
===================================================== */

canvas.addEventListener(
  "pointercancel",
  function(event){

    if(
      game.dragging
    ){

      game.dragging=false;

      game.pointerId=null;

      resetCurrentBird();

    }

  }
);


/* =====================================================
   PREVENT TOUCH SCROLL
===================================================== */

canvas.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

  },
  {
    passive:false
  }
);


canvas.addEventListener(
  "touchmove",
  function(event){

    event.preventDefault();

  },
  {
    passive:false
  }
);


canvas.addEventListener(
  "touchend",
  function(event){

    event.preventDefault();

  },
  {
    passive:false
  }
);


/* =====================================================
   SPECIAL BIRD TAP
===================================================== */

/*
   Pointerdown above already handles:
   Mouse click
   Mobile touch
   Tablet touch

   The old click event is NOT needed.
*/


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
  "keydown",
  function(event){

    if(
      event.key==="r" ||
      event.key==="R"
    ){

      loadLevel(
        game.level
      );

    }


    /* Space = bird ability */

    if(
      event.code==="Space"
    ){

      event.preventDefault();

      useBirdAbility();

    }

  }
);/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

  if(
    !game.gameOver
  ){

    updateBird();

    /* Update birds created by Blue ability */

    updateAbilityBirds();


    /* Check win */

    if(
      game.pigs.length===0
    ){

      winLevel();

    }

  }


  draw();


  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================================
   START GAME
===================================================== */

game.score=0;

scoreText.textContent=0;

loadLevel(1);

gameLoop();

</script>
