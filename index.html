/* =====================================================
   HELPER FUNCTIONS
===================================================== */

function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(max,value)
  );

}


function distance(x1,y1,x2,y2){

  return Math.hypot(
    x2-x1,
    y2-y1
  );

}


function addScore(points){

  game.score += points;

  scoreText.textContent =
    game.score;

}


/* =====================================================
   CREATE BIRD
===================================================== */

function createBird(type){

  return {

    type:type,

    x:WORLD.slingX,

    y:WORLD.slingY,

    radius:WORLD.birdRadius,

    vx:0,

    vy:0,

    launched:false,

    used:false,

    abilityUsed:false,

    alive:true

  };

}


/* =====================================================
   CREATE PIG
===================================================== */

function createPig(x,y){

  return {

    x:x,

    y:y,

    w:38,

    h:32,

    hp:1,

    alive:true

  };

}


/* =====================================================
   CREATE BLOCK
===================================================== */

function createBlock(
  x,y,w,h,material
){

  return {

    x:x,

    y:y,

    w:w,

    h:h,

    material:material,

    hp:
      material==="stone"
      ? 4
      : 2

  };

}


/* =====================================================
   LOAD LEVEL
===================================================== */

function loadLevel(levelNumber){

  const data =
    LEVELS[levelNumber-1];

  game.level =
    levelNumber;

  game.birds =
    data.birds.map(
      type => createBird(type)
    );

  game.birdIndex = 0;

  /* CLEAR EXTRA BLUE BIRDS */
  game.abilityBirds = [];

  game.pigs =
    data.pigs.map(
      p => createPig(p[0],p[1])
    );

  game.blocks =
    data.blocks.map(
      b => createBlock(
        b[0],
        b[1],
        b[2],
        b[3],
        b[4]
      )
    );

  game.dragging = false;

  game.gameOver = false;

  game.levelChanging = false;

  levelText.textContent =
    levelNumber;

  updateBirdInfo();

  hideMessage();

}


/* =====================================================
   CURRENT BIRD
===================================================== */

function getBird(){

  return game.birds[
    game.birdIndex
  ] || null;

}


function updateBirdInfo(){

  const bird =
    getBird();

  if(!bird){

    birdNameText.textContent =
      "-";

    return;

  }

  birdNameText.textContent =
    BIRD_TYPES[bird.type].name;

}


/* =====================================================
   RESET BIRD POSITION
===================================================== */

function resetCurrentBird(){

  const bird =
    getBird();

  if(!bird) return;

  bird.x =
    WORLD.slingX;

  bird.y =
    WORLD.slingY;

  bird.vx=0;

  bird.vy=0;

  bird.launched=false;

  bird.used=false;

  bird.abilityUsed=false;

  bird.alive=true;

}


/* =====================================================
   NEXT BIRD
===================================================== */

function nextBird(){

  if(game.gameOver) return;

  game.birdIndex++;

  if(
    game.birdIndex >=
    game.birds.length
  ){

    loseGame();

    return;

  }

  resetCurrentBird();

  updateBirdInfo();

}


/* =====================================================
   WIN
===================================================== */

function winLevel(){

  if(game.gameOver) return;

  game.gameOver=true;

  game.levelChanging=true;

  if(game.level >= 10){

    showMessage(
      "നീ ഒരു ഭയകരൻ തന്നെ",
      "All 10 levels completed! 🏆",
      "Play Again"
    );

    messageButton.onclick =
      function(){

        game.score=0;

        scoreText.textContent=0;

        loadLevel(1);

      };

  }
  else{

    showMessage(
      "അടുത്തത് നോക്ക് മച്ചു",
      "Level "+game.level+
      " completed! 🔥",
      "Next Level"
    );

    messageButton.onclick =
      function(){

        loadLevel(
          game.level+1
        );

      };

  }

}


/* =====================================================
   LOSE
===================================================== */

function loseGame(){

  game.gameOver=true;

  showMessage(
    ". വെല്ല പണിക്കും പോടാ",
    "Try the level again 😂",
    "Retry"
  );

  messageButton.onclick =
    function(){

      loadLevel(
        game.level
      );

    };

}


/* =====================================================
   MESSAGE BOX
===================================================== */

function showMessage(
  main,
  sub,
  button
){

    main;

  subMessage.textContent =
    sub;

  messageButton.textContent =
    button;

  messageBox.classList.add(
    "show"
  );

}


function hideMessage(){

  messageBox.classList.remove(
    "show"
  );

}


/* =====================================================
   COLLISION HELPER
===================================================== */

function circleRectCollision(
  cx,cy,r,rect
){

  const closestX =
    clamp(
      cx,
      rect.x,
      rect.x+rect.w
    );

  const closestY =
    clamp(
      cy,
      rect.y,
      rect.y+rect.h
    );

  const dx =
    cx-closestX;

  const dy =
    cy-closestY;

  return(
    dx*dx+
    dy*dy
    <=
    r*r
  );

}


/* =====================================================
   BIRD-BLOCK COLLISION
===================================================== */

function hitBlock(
  bird,
  block
){

  if(
    !circleRectCollision(
      bird.x,
      bird.y,
      bird.radius,
      block
    )
  ){

    return false;

  }


  const speed =
    Math.hypot(
      bird.vx,
      bird.vy
    );


  let damage=1;


  if(speed>12)
    damage=3;

  else if(speed>7)
    damage=2;


  block.hp -= damage;

  addScore(10);


  if(block.hp<=0){

    const index =
      game.blocks.indexOf(
        block
      );

    if(index>=0){

      game.blocks.splice(
        index,
        1
      );

      addScore(20);

    }

  }


  bird.vx *= -.45;

  bird.vy *= -.45;


  return true;

}


/* =====================================================
   BIRD-PIG COLLISION
===================================================== */

function hitPig(
  bird,
  pig
){

  if(
    !circleRectCollision(
      bird.x,
      bird.y,
      bird.radius,
      {
        x:pig.x-pig.w/2,
        y:pig.y-pig.h/2,
        w:pig.w,
        h:pig.h
      }
    )
  ){

    return false;

  }


  pig.hp=0;

  pig.alive=false;

  addScore(100);


  const index =
    game.pigs.indexOf(
      pig
    );


  if(index>=0){

    game.pigs.splice(
      index,
      1
    );

  }


  bird.vx *= .5;

  bird.vy *= .5;


  return true;

} /* =====================================================
   BIRD ABILITIES
===================================================== */

function useBirdAbility(){

  const bird =
    getBird();


  if(
    !bird ||
    !bird.launched ||
    bird.abilityUsed ||
    game.gameOver
  ){

    return;

  }


  bird.abilityUsed=true;


  /* =========================
     YELLOW - SPEED BOOST
  ========================= */

  if(bird.type==="yellow"){

    const speed =
      Math.hypot(
        bird.vx,
        bird.vy
      );

    if(speed>0){

      bird.vx *= 2;

      bird.vy *= 2;

    }

  }


  /* =========================
     BLUE - TRIPLE SPLIT
  ========================= */

  else if(bird.type==="blue"){

    const speed =
      Math.max(
        7,
        Math.hypot(
          bird.vx,
          bird.vy
        )
      );


    const baseAngle =
      Math.atan2(
        bird.vy,
        bird.vx
      );


    const angles=[
      -0.45,
      0.45
    ];


    for(
      let i=0;
      i<angles.length;
      i++
    ){

      const newBird =
        createBird("blue");


      newBird.x =
        bird.x;

      newBird.y =
        bird.y;


      const angle =
        baseAngle+
        angles[i];


      newBird.vx =
        Math.cos(angle)*
        speed;

      newBird.vy =
        Math.sin(angle)*
        speed;


      newBird.launched=true;

      newBird.used=true;

      newBird.abilityUsed=true;

      newBird.alive=true;


      game.abilityBirds.push(
        newBird
      );

    }

  }


  /* =========================
     BLACK - EXPLOSION
  ========================= */

  else if(bird.type==="black"){

    const explosionRadius=115;


    /* Destroy nearby pigs */

    for(
      const pig
      of [...game.pigs]
    ){

      if(
        distance(
          bird.x,
          bird.y,
          pig.x,
          pig.y
        )
        <
        explosionRadius
      ){

        pig.hp=0;

        pig.alive=false;


        const index =
          game.pigs.indexOf(
            pig
          );


        if(index>=0){

          game.pigs.splice(
            index,
            1
          );

          addScore(100);

        }

      }

    }


    /* Destroy nearby blocks */

    for(
      const block
      of [...game.blocks]
    ){

      if(
        distance(
          bird.x,
          bird.y,
          block.x+
          block.w/2,
          block.y+
          block.h/2
        )
        <
        explosionRadius
      ){

        const index =
          game.blocks.indexOf(
            block
          );


        if(index>=0){

          game.blocks.splice(
            index,
            1
          );

          addScore(30);

        }

      }

    }


    bird.vx=0;

    bird.vy=0;

  }

}


/* =====================================================
   UPDATE EXTRA ABILITY BIRDS
===================================================== */

function updateAbilityBirds(){

  for(
    const bird
    of [...game.abilityBirds]
  ){

    bird.vy +=
      WORLD.gravity;


    bird.x +=
      bird.vx;

    bird.y +=
      bird.vy;


    bird.vx *=
      .998;

    bird.vy *=
      .998;


    /* Block collision */

    for(
      const block
      of [...game.blocks]
    ){

      hitBlock(
        bird,
        block
      );

    }


    /* Pig collision */

    for(
      const pig
      of [...game.pigs]
    ){

      hitPig(
        bird,
        pig
      );

    }


    /* Ground */

    if(
      bird.y+
      bird.radius
      >
      WORLD.groundY
    ){

      bird.y =
        WORLD.groundY-
        bird.radius;

      bird.vy *=
        -.35;

      bird.vx *=
        .70;

    }


    /* Remove when far outside */

    if(
      bird.x<
        -150 ||
      bird.x>
        WORLD.width+150 ||
      bird.y>
        WORLD.height+150
    ){

      const index =
        game.abilityBirds.indexOf(
          bird
        );


      if(index>=0){

        game.abilityBirds.splice(
          index,
          1
        );

      }

    }

  }

}


/* =====================================================
   UPDATE BIRD
===================================================== */

function updateBird(){

  const bird =
    getBird();

  if(!bird) return;


  /* Bird waiting on slingshot */

  if(!bird.launched){

    if(game.dragging){

      let dx =
        game.pointer.x-
        WORLD.slingX;

      let dy =
        game.pointer.y-
        WORLD.slingY;


      const d =
        Math.hypot(
          dx,
          dy
        );


      if(
        d>WORLD.maxPull
      ){

        dx =
          dx/d*
          WORLD.maxPull;

        dy =
          dy/d*
          WORLD.maxPull;

      }


      bird.x =
        WORLD.slingX+
        dx;

      bird.y =
        WORLD.slingY+
        dy;

    }
    else{

      bird.x =
        WORLD.slingX;

      bird.y =
        WORLD.slingY;

    }

    return;

  }


  /* Gravity */

  bird.vy +=
    WORLD.gravity;


  /* Movement */

  bird.x +=
    bird.vx;

  bird.y +=
    bird.vy;


  /* Air resistance */

  bird.vx *=
    .998;

  bird.vy *=
    .998;


  /* Block collision */

  for(
    const block
    of [...game.blocks]
  ){

    hitBlock(
      bird,
      block
    );

  }


  /* Pig collision */

  for(
    const pig
    of [...game.pigs]
  ){

    hitPig(
      bird,
      pig
    );

  }


  /* Ground */

  if(
    bird.y+
    bird.radius
    >
    WORLD.groundY
  ){

    bird.y =
      WORLD.groundY-
      bird.radius;

    bird.vy *=
      -.35;

    bird.vx *=
      .70;

  }


  /* Out of screen */

  if(
    bird.x<
      -150 ||
    bird.x>
      WORLD.width+150 ||
    bird.y>
      WORLD.height+150
  ){

    nextBird();

    return;

  }


  /* Bird stopped */

  const speed =
    Math.hypot(
      bird.vx,
      bird.vy
    );


  if(
    speed<.35 &&
    bird.y+
    bird.radius
    >=
    WORLD.groundY-2
  ){

    bird.vx=0;

    bird.vy=0;

    setTimeout(
      function(){

        if(
          !game.gameOver &&
          getBird()===bird
        ){

          nextBird();

        }

      },
      500
    );

  }

}


/* =====================================================
   SLINGSHOT
===================================================== */

function drawSlingshot(){

  const x =
    WORLD.slingX;

  const y =
    WORLD.slingY;


  ctx.lineCap=
    "round";


  /* Wood */

  ctx.strokeStyle=
    "#603b18";

  ctx.lineWidth=12;


  ctx.beginPath();

  ctx.moveTo(
    x-18,
    y+75
  );

  ctx.lineTo(
    x-7,
    y-18
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x+18,
    y+75
  );

  ctx.lineTo(
    x+7,
    y-18
  );

  ctx.stroke();


  /* Rubber */

  const bird =
    getBird();


  if(
    bird &&
    !bird.launched
  ){

    ctx.strokeStyle=
      "#25170d";

    ctx.lineWidth=5;


    ctx.beginPath();

    ctx.moveTo(
      x-7,
      y-18
    );

    ctx.lineTo(
      bird.x,
      bird.y
    );

    ctx.lineTo(
      x+7,
      y-18
    );

    ctx.stroke();

  }

}

function drawBird(
  bird
){

  ctx.save();

  ctx.translate(
    bird.x,
    bird.y
  );


  const type =
    BIRD_TYPES[
      bird.type
    ];


  /* Body */

  ctx.fillStyle=
    type.color;


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    bird.radius,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Belly */

  ctx.fillStyle=
    "rgba(255,255,255,.18)";

  ctx.beginPath();

  ctx.arc(
    -3,
    5,
    10,
    0,
    Math.PI
  );

  ctx.fill();


  /* Eyes */

  ctx.fillStyle=
    "white";


  ctx.beginPath();

  ctx.arc(
    -6,
    -5,
    5,
    0,
    Math.PI*2
  );

  ctx.arc(
    6,
    -5,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle=
    "black";


  ctx.beginPath();

  ctx.arc(
    -5,
    -5,
    2,
    0,
    Math.PI*2
  );

  ctx.arc(
    5,
    -5,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Beak */

  ctx.fillStyle=
    "#f2a51c";


  ctx.beginPath();

  ctx.moveTo(
    15,
    0
  );

  ctx.lineTo(
    30,
    6
  );

  ctx.lineTo(
    15,
    12
  );

  ctx.closePath();

  ctx.fill();


  /* Angry eyebrows */

  ctx.strokeStyle=
    "#351b15";

  ctx.lineWidth=4;


  ctx.beginPath();

  ctx.moveTo(
    -13,
    -12
  );

  ctx.lineTo(
    -2,
    -9
  );

  ctx.moveTo(
    2,
    -9
  );

  ctx.lineTo(
    13,
    -12
  );

  ctx.stroke();


  /* Black bird fuse */

  if(
    bird.type==="black"
  ){

    ctx.strokeStyle=
      "#222";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
      -5,
      -18
    );

    ctx.lineTo(
      0,
      -27
    );

    ctx.stroke();

  }


  ctx.restore();

      }function drawBird(bird){
  ctx.save();

  ctx.translate(bird.x,bird.y);

  ctx.fillStyle=
    BIRD_TYPES[bird.type].color;

  ctx.beginPath();
  ctx.arc(
    0,
    0,
    bird.radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="white";

  ctx.beginPath();
  ctx.arc(-6,-5,5,0,Math.PI*2);
  ctx.arc(6,-5,5,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="black";

  ctx.beginPath();
  ctx.arc(-6,-5,2,0,Math.PI*2);
  ctx.arc(6,-5,2,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#f39c12";

  ctx.beginPath();
  ctx.moveTo(0,2);
  ctx.lineTo(18,7);
  ctx.lineTo(0,11);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}


function drawPig(pig){

  ctx.translate(pig.x,pig.y);

  ctx.beginPath();

  );

function drawBlock(block){

  ctx.fillStyle=

function drawSling(){
  ctx.strokeStyle="#6b3f20";
  ctx.lineWidth=10;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    WORLD.slingX-25,
    WORLD.slingY+55
  );

  ctx.lineTo(
    WORLD.slingX-12,
    WORLD.slingY-15
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    WORLD.slingX+25,
    WORLD.slingY+55
  );

  ctx.lineTo(
    WORLD.slingX+12,
    WORLD.slingY-15
  );

  ){

    ctx.moveTo(

      WORLD.slingY-15
    );

    ctx.lineTo(
      bird.x,
      bird.y
    );

    ctx.lineTo(
      WORLD.slingX+12,
      WORLD.slingY-15
    );

    ctx.stroke();
  }
}


function drawTrajectory(){
  const bird=
    game.birds[game.birdIndex];

  if(
    !bird ||
    bird.launched ||
    !game.dragging
  ){
    return;
  }

  const dx =
    bird.x-
    WORLD.slingX;

  const dy =
    bird.y-
    WORLD.slingY;

  const vx =
    -dx*.12;

  const vy =
    -dy*.12;

  ctx.fillStyle=
    "rgba(255,255,255,.75)";

  for(
    let i=1;
    i<25;
    i++
  ){
    const t=i*.18;

    const x=
      bird.x+
      vx*t;

    const y=
      bird.y+
      vy*t+
      .5*WORLD.gravity*t*t;

    if(
      x<0 ||
      x>WORLD.width ||
      y>WORLD.height
    ){
      break;
    }

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


function draw(){
  ctx.clearRect(
    0,
    0,
    WORLD.width,
    WORLD.height
  );

  drawBackground();

  drawBlocks();

  drawPigs();

  drawSling();

  drawTrajectory();

  const bird=
    game.birds[game.birdIndex];

  if(bird){
    drawBird(bird);
  }

  for(
    const b of game.abilityBirds
  ){

}

function updateBird(){
  const bird=
    game.birds[game.birdIndex];

  if(
    !bird ||
    !bird.launched ||
    !bird.alive
  ){
    return;
  }

  bird.vy+=
    WORLD.gravity;

  bird.x+=
    bird.vx;

  bird.y+=
    bird.vy;

  bird.vx*=.995;
  bird.vy*=.995;

  if(
    bird.y+
    bird.radius>
    WORLD.groundY
  ){
    bird.y=
      WORLD.groundY-
      bird.radius;

    bird.vy*=-.45;
    bird.vx*=.7;

    if(
      Math.abs(bird.vy)<1
    ){
      bird.alive=false;
    }
  }

  if(
    bird.x<
      -100 ||
    bird.x>
      WORLD.width+100 ||
    bird.y>
      WORLD.height+100
  ){
    bird.alive=false;
  }

  checkBirdPigCollision(bird);

  checkBirdBlockCollision(bird);
      }function checkBirdPigCollision(bird){
  for(
    let i=game.pigs.length-1;
    i>=0;
    i--
  ){
    const pig=
      game.pigs[i];

    const dx=
      bird.x-pig.x;

    const dy=
      bird.y-pig.y;

    const distance=
      Math.hypot(dx,dy);

    if(
      distance<
      bird.radius+
      pig.radius
    ){
      game.score+=100;

      game.pigs.splice(i,1);

      bird.vx*=.7;
      bird.vy*=.7;
    }
  }
}


function checkBirdBlockCollision(bird){
  for(
    let i=game.blocks.length-1;
    i>=0;
    i--
  ){
    const block=
      game.blocks[i];

    const dx=
      bird.x-block.x;

    const dy=
      bird.y-block.y;

    const distance=
      Math.hypot(dx,dy);

    const hitRadius=
      bird.radius+
      Math.max(
        block.w,
        block.h
      )/2;

    if(
      distance<
      hitRadius
    ){
      const speed=
        Math.hypot(
          bird.vx,
          bird.vy
        );

      if(speed>5){
        game.score+=30;

        game.blocks.splice(
          i,
          1
        );

        bird.vx*=.65;
        bird.vy*=.65;
      }
    }
  }
}


function updateAbilityBirds(){
  for(
    let i=
      game.abilityBirds.length-1;
    i>=0;
    i--
  ){
    const bird=
      game.abilityBirds[i];

    bird.vy+=
      WORLD.gravity;

    bird.x+=
      bird.vx;

    bird.y+=
      bird.vy;

    bird.vx*=.995;
    bird.vy*=.995;

    if(
      bird.y+
      bird.radius>
      WORLD.groundY
    ){
      bird.y=
        WORLD.groundY-
        bird.radius;

      bird.vy*=-.45;
      bird.vx*=.7;
    }

    checkBirdPigCollision(bird);

    checkBirdBlockCollision(bird);

    if(
      bird.x<
        -100 ||
      bird.x>
        WORLD.width+100 ||
      bird.y>
        WORLD.height+100
    ){
      game.abilityBirds.splice(
        i,
        1
      );
    }
  }
}


function launchBird(){
  const bird=
    game.birds[game.birdIndex];

  if(
    !bird ||
    bird.launched ||
    game.gameOver
  ){
    return;
  }

  const dx =
    bird.x-
    WORLD.slingX;

  const dy =
    bird.y-
    WORLD.slingY;

  bird.vx =
    -dx*.12;

  bird.vy =
    -dy*.12;

  bird.launched=true;

  game.dragging=false;
}


function nextBird(){
  game.birdIndex++;

  if(
    game.birdIndex>=
    game.birds.length
  ){
    setTimeout(()=>{
      if(
        game.pigs.length>0 &&
        !game.gameOver
      ){
        showMessage(
          "Level Failed",
          "No birds left!",
          "Retry"
        );
      }
    },800);

    return;
  }

  const bird=
    game.birds[game.birdIndex];

  bird.x=
    WORLD.slingX;

  bird.y=
    WORLD.slingY;
}


function useBirdAbility(){
  const bird=
    game.birds[game.birdIndex];

  if(
    !bird ||
    !bird.launched ||
    bird.abilityUsed ||
    game.gameOver
  ){
    return;
  }

  bird.abilityUsed=true;

  if(
    bird.type==="yellow"
  ){
    bird.vx*=2;
    bird.vy*=2;
  }

  else if(
    bird.type==="blue"
  ){
    const speed=
      Math.max(
        7,
        Math.hypot(
          bird.vx,
          bird.vy
        )
      );

    const angle=
      Math.atan2(
        bird.vy,
        bird.vx
      );

    for(
      const offset of [-.45,.45]
    ){
      game.abilityBirds.push({
        type:"blue",
        x:bird.x,
        y:bird.y,
        radius:WORLD.birdRadius,
        vx:
          Math.cos(
            angle+offset
          )*speed,
        vy:
          Math.sin(
            angle+offset
          )*speed,
        launched:true,
        used:true,
        abilityUsed:true,
        alive:true
      });
    }
  }

  else if(
    bird.type==="black"
  ){
    const radius=115;

    for(
      let i=game.pigs.length-1;
      i>=0;
      i--
    ){
      const pig=
        game.pigs[i];

      if(
        Math.hypot(
          pig.x-bird.x,
          pig.y-bird.y
        )<radius
      ){
        game.pigs.splice(i,1);
        game.score+=100;
      }
    }

    for(
      let i=game.blocks.length-1;
      i>=0;
      i--
    ){
      const block=
        game.blocks[i];

      if(
        Math.hypot(
          block.x-bird.x,
          block.y-bird.y
        )<radius
      ){
        game.blocks.splice(i,1);
        game.score+=30;
      }
    }

    bird.vx=0;
    bird.vy=0;
  }
}

canvas.addEventListener(
  "pointerdown",
  e=>{
    if(game.gameOver){
      return;
    }

    e.preventDefault();

    updatePointer(e);

    const bird=
      game.birds[game.birdIndex];

    if(
      bird &&
      bird.launched
    ){
      useBirdAbility();
      return;
    }

    if(
      bird &&
      !bird.launched &&
      Math.hypot(
        e.offsetX-bird.x,
        e.offsetY-bird.y
      )<40
    ){
      game.dragging=true;
      game.pointerId=
        e.pointerId;

      canvas.setPointerCapture(
        e.pointerId
      );
    }
  }
);


canvas.addEventListener(
  "pointermove",
  e=>{
    if(
      !game.dragging ||
      game.pointerId!==e.pointerId
    ){
      return;
    }

    e.preventDefault();

    updatePointer(e);

    const bird=
      game.birds[game.birdIndex];

    if(!bird){
      return;
    }

    let dx=
      game.pointer.x-
      WORLD.slingX;

    let dy=
      game.pointer.y-
      WORLD.slingY;

    const distance=
      Math.hypot(dx,dy);

    if(
      distance>WORLD.maxPull
    ){
      const scale=
        WORLD.maxPull/
        distance;

      dx*=scale;
      dy*=scale;
    }

    bird.x=
      WORLD.slingX+dx;

    bird.y=
      WORLD.slingY+dy;
  }
);


canvas.addEventListener(
  "pointerup",
  e=>{
    if(
      game.pointerId!==e.pointerId
    ){
      return;
    }

    if(
      game.dragging
    ){
      launchBird();
    }

    game.dragging=false;
    game.pointerId=null;
  }
);


canvas.addEventListener(
  "pointercancel",
  e=>{
    game.dragging=false;
    game.pointerId=null;
  }
);


window.addEventListener(
  "keydown",
  e=>{
    if(
      e.code==="Space"
    ){
      e.preventDefault();
      useBirdAbility();
    }
  }
);


function updatePointer(e){
  const rect=
    canvas.getBoundingClientRect();

  game.pointer.x=
    (e.clientX-rect.left)*
    WORLD.width/
    rect.width;

  game.pointer.y=
    (e.clientY-rect.top)*
    WORLD.height/
    rect.height;
}


function gameLoop(){
  updateBird();

  updateAbilityBirds();

  if(
    game.pigs.length===0 &&
    !game.levelChanging
  ){
    game.levelChanging=true;

    setTimeout(()=>{
      if(
        game.level<10
      ){
        showMessage(
          "Level Complete!",
          "അടുത്തത് നോക്ക് മച്ചു",
          "Next Level"
        );
      }
      else{
        showMessage(
          "നീ ഒരു ഭയകരൻ തന്നെ",
          "You completed all 10 levels!",
          "Play Again"
        );
      }
    },700);
  }

  draw();

  requestAnimationFrame(
    gameLoop
  );
}


loadLevel();

gameLoop();
</script>

</html>
