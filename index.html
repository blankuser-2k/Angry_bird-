<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Bird Smash - 10 Levels</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

#gameWrap {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-width: 1000px;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: linear-gradient(#7dd8ff, #dff8ff);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#topBar {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
  z-index: 5;
}

.info {
  background: rgba(0,0,0,.55);
  color: white;
  padding: 7px 10px;
  border-radius: 10px;
  font-size: 14px;
}

#abilityInfo {
  position: absolute;
  left: 50%;
  bottom: 78px;
  transform: translateX(-50%);
  background: rgba(0,0,0,.65);
  color: white;
  padding: 8px 14px;
  border-radius: 15px;
  font-size: 14px;
  pointer-events: none;
  text-align: center;
  z-index: 5;
}

#messageBox {
  position: absolute;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,.48);
  z-index: 10;
}

#messageCard {
  width: min(90%, 420px);
  background: white;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.3);
}

#message {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 20px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 12px 22px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#actionBtn {
  background: #222;
  color: white;
}

#help {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: rgba(0,0,0,.5);
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 12px;
  pointer-events: none;
  z-index: 5;
}
</style>
</head>

<body>

<div id="gameWrap">

<canvas id="game"></canvas>

<div id="topBar">
  <div class="info" id="levelInfo">Level 1</div>
  <div class="info" id="scoreInfo">Score: 0</div>
</div>

<div id="abilityInfo">
  Drag the bird and release!
</div>

<div id="help">
  🖱️ Click / 👆 Tap while flying = Ability
</div>

<div id="messageBox">
  <div id="messageCard">
    <div id="message"></div>
    <button id="actionBtn"></button>
  </div>
</div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const levelInfo = document.getElementById("levelInfo");
const scoreInfo = document.getElementById("scoreInfo");
const abilityInfo = document.getElementById("abilityInfo");

const messageBox = document.getElementById("messageBox");
const message = document.getElementById("message");
const actionBtn = document.getElementById("actionBtn");

let W = 900;
let H = 600;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();

  W = 900;
  H = 600;

  canvas.width = W;
  canvas.height = H;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);


/* =========================
   BIRD TYPES
========================= */

const BIRD_TYPES = {

  red: {
    name: "Red Bird",
    ability: "Normal",
    color: "#e53935",
    radius: 18
  },

  yellow: {
    name: "Yellow Bird",
    ability: "Speed Boost",
    color: "#ffd600",
    radius: 18
  },

  blue: {
    name: "Blue Bird",
    ability: "Triple Split",
    color: "#2196f3",
    radius: 16
  },

  black: {
    name: "Black Bird",
    ability: "Explosion",
    color: "#222",
    radius: 20
  }
};


/* =========================
   LEVEL DATA
========================= */

const LEVELS = [

  {
    birds: ["red", "red"],
    pigs: 1
  },

  {
    birds: ["red", "yellow"],
    pigs: 2
  },

  {
    birds: ["yellow", "red"],
    pigs: 2
  },

  {
    birds: ["blue", "red"],
    pigs: 2
  },

  {
    birds: ["black", "red"],
    pigs: 3
  },

  {
    birds: ["blue", "yellow", "red"],
    pigs: 3
  },

  {
    birds: ["yellow", "blue", "red"],
    pigs: 3
  },

  {
    birds: ["black", "blue", "red"],
    pigs: 3
  },

  {
    birds: ["blue", "black", "yellow"],
    pigs: 4
  },

  {
    birds: ["black"],
    pigs: 4
  }

];


/* =========================
   GAME STATE
========================= */

const game = {

  level: 0,

  score: 0,

  birds: [],

  birdIndex: 0,

  pigs: [],

  blocks: [],

  extraBirds: [],

  currentBird: null,

  dragging: false,

  launched: false,

  gameOver: false,

  levelFinished: false,

  gravity: 0.28
};


/* =========================
   HELPERS
========================= */

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function distance(x1, y1, x2, y2) {
  return Math.hypot(x2 - x1, y2 - y1);
}

function random(min, max) {
  return Math.random() * (max - min) + min;
}


/* =========================
   SLINGSHOT
========================= */

const sling = {
  x: 150,
  y: 455
};


/* =========================
   LOAD LEVEL
========================= */

function loadLevel(index) {

  game.level = index;

  game.birds = LEVELS[index].birds.map(type => ({
    type: type,
    x: sling.x,
    y: sling.y,
    vx: 0,
    vy: 0,
    launched: false,
    abilityUsed: false,
    alive: true
  }));

  game.birdIndex = 0;

  game.currentBird = game.birds[0];

  game.pigs = [];

  game.blocks = [];

  game.extraBirds = [];

  game.dragging = false;
  game.launched = false;
  game.gameOver = false;
  game.levelFinished = false;

  createLevelObjects();

  updateUI();

  messageBox.style.display = "none";
}


/* =========================
   CREATE LEVEL OBJECTS
========================= */

function createLevelObjects() {

  const pigCount = LEVELS[game.level].pigs;

  /*
    Different arrangements depending
    on level.
  */

  const startX = 620;

  for (let i = 0; i < pigCount; i++) {

    let x;
    let y;

    if (game.level === 9) {

      // Level 10: difficult arrangement

      const positions = [
        [620, 470],
        [700, 470],
        [660, 380],
        [740, 380]
      ];

      x = positions[i][0];
      y = positions[i][1];

    } else {

      x = startX + (i % 2) * 90;

      if (i < 2) {
        y = 470;
      } else {
        y = 380 - Math.floor(i / 2) * 70;
      }
    }

    game.pigs.push({
      x: x,
      y: y,
      radius: 23,
      alive: true
    });
  }


  /*
    Blocks
  */

  if (game.level === 9) {

    // Strong Level 10 structure

    game.blocks.push(
      {x: 575, y: 500, w: 230, h: 20, hp: 3},
      {x: 575, y: 405, w: 20, h: 95, hp: 3},
      {x: 785, y: 405, w: 20, h: 95, hp: 3},
      {x: 640, y: 315, w: 20, h: 90, hp: 3},
      {x: 720, y: 315, w: 20, h: 90, hp: 3},
      {x: 620, y: 295, w: 140, h: 20, hp: 3}
    );

  } else {

    game.blocks.push(
      {x: 570, y: 500, w: 220, h: 20, hp: 2},
      {x: 570, y: 420, w: 20, h: 80, hp: 2},
      {x: 770, y: 420, w: 20, h: 80, hp: 2}
    );

    if (pigCount >= 3) {
      game.blocks.push(
        {x: 640, y: 350, w: 20, h: 70, hp: 2},
        {x: 700, y: 350, w: 20, h: 70, hp: 2}
      );
    }
  }
}


/* =========================
   UI
========================= */

function updateUI() {

  levelInfo.textContent =
    "Level " + (game.level + 1) + " / 10";

  scoreInfo.textContent =
    "Score: " + game.score;

  const bird = game.currentBird;

  if (!bird) {
    abilityInfo.textContent = "";
    return;
  }

  const info = BIRD_TYPES[bird.type];

  abilityInfo.textContent =
    info.name + " | Ability: " + info.ability;
}


/* =========================
   NEXT BIRD
========================= */

function nextBird() {

  game.birdIndex++;

  game.extraBirds = [];

  if (game.birdIndex >= game.birds.length) {

    if (alivePigs() === 0) {
      winLevel();
    } else {
      loseGame();
    }

    return;
  }

  const bird = game.birds[game.birdIndex];

  bird.x = sling.x;
  bird.y = sling.y;
  bird.vx = 0;
  bird.vy = 0;
  bird.launched = false;
  bird.abilityUsed = false;
  bird.alive = true;

  game.currentBird = bird;

  game.launched = false;

  updateUI();
}


/* =========================
   COUNT PIGS
========================= */

function alivePigs() {
  return game.pigs.filter(p => p.alive).length;
}/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground() {

  ctx.fillStyle = "#8ed8ff";
  ctx.fillRect(0, 0, W, H);

  // Clouds

  ctx.fillStyle = "rgba(255,255,255,.75)";

  ctx.beginPath();
  ctx.arc(150, 100, 30, 0, Math.PI * 2);
  ctx.arc(185, 100, 40, 0, Math.PI * 2);
  ctx.arc(225, 105, 28, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(500, 80, 25, 0, Math.PI * 2);
  ctx.arc(530, 80, 35, 0, Math.PI * 2);
  ctx.arc(570, 85, 25, 0, Math.PI * 2);
  ctx.fill();

  // Ground

  ctx.fillStyle = "#65b84f";
  ctx.fillRect(0, 520, W, 80);

  ctx.fillStyle = "#8b5a2b";
  ctx.fillRect(0, 540, W, 60);
}


/* =========================
   DRAW SLINGSHOT
========================= */

function drawSlingshot() {

  ctx.lineWidth = 12;
  ctx.strokeStyle = "#754c24";

  ctx.beginPath();
  ctx.moveTo(135, 520);
  ctx.lineTo(145, 455);
  ctx.moveTo(175, 520);
  ctx.lineTo(160, 455);
  ctx.stroke();

  if (game.currentBird && !game.currentBird.launched) {

    ctx.strokeStyle = "#333";
    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(145, 455);
    ctx.lineTo(game.currentBird.x, game.currentBird.y);
    ctx.moveTo(160, 455);
    ctx.lineTo(game.currentBird.x, game.currentBird.y);

    ctx.stroke();
  }
}


/* =========================
   DRAW BIRD
========================= */

function drawBird(bird) {

  if (!bird || !bird.alive) return;

  const info = BIRD_TYPES[bird.type];

  ctx.save();

  ctx.fillStyle = info.color;

  ctx.beginPath();
  ctx.arc(
    bird.x,
    bird.y,
    info.radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  // eyes

  ctx.fillStyle = "white";

  ctx.beginPath();
  ctx.arc(
    bird.x - 6,
    bird.y - 5,
    5,
    0,
    Math.PI * 2
  );

  ctx.arc(
    bird.x + 6,
    bird.y - 5,
    5,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "black";

  ctx.beginPath();
  ctx.arc(
    bird.x - 6,
    bird.y - 5,
    2,
    0,
    Math.PI * 2
  );

  ctx.arc(
    bird.x + 6,
    bird.y - 5,
    2,
    0,
    Math.PI * 2
  );

  ctx.fill();

  // beak

  ctx.fillStyle = "#ff9800";

  ctx.beginPath();

  ctx.moveTo(bird.x + info.radius - 2, bird.y);
  ctx.lineTo(bird.x + info.radius + 12, bird.y + 5);
  ctx.lineTo(bird.x + info.radius - 2, bird.y + 10);

  ctx.closePath();
  ctx.fill();

  ctx.restore();
}


/* =========================
   DRAW PIG
========================= */

function drawPig(pig) {

  if (!pig.alive) return;

  ctx.fillStyle = "#66bb6a";

  ctx.beginPath();
  ctx.arc(
    pig.x,
    pig.y,
    pig.radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  // ears

  ctx.fillStyle = "#4caf50";

  ctx.beginPath();
  ctx.arc(
    pig.x - 17,
    pig.y - 18,
    8,
    0,
    Math.PI * 2
  );

  ctx.arc(
    pig.x + 17,
    pig.y - 18,
    8,
    0,
    Math.PI * 2
  );

  ctx.fill();

  // eyes

  ctx.fillStyle = "white";

  ctx.beginPath();

  ctx.arc(
    pig.x - 7,
    pig.y - 5,
    5,
    0,
    Math.PI * 2
  );

  ctx.arc(
    pig.x + 7,
    pig.y - 5,
    5,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "black";

  ctx.beginPath();

  ctx.arc(
    pig.x - 7,
    pig.y - 5,
    2,
    0,
    Math.PI * 2
  );

  ctx.arc(
    pig.x + 7,
    pig.y - 5,
    2,
    0,
    Math.PI * 2
  );

  ctx.fill();

  // nose

  ctx.fillStyle = "#388e3c";

  ctx.beginPath();

  ctx.ellipse(
    pig.x,
    pig.y + 8,
    12,
    8,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "#111";

  ctx.beginPath();

  ctx.arc(pig.x - 4, pig.y + 8, 2, 0, Math.PI * 2);
  ctx.arc(pig.x + 4, pig.y + 8, 2, 0, Math.PI * 2);

  ctx.fill();
}


/* =========================
   DRAW BLOCK
========================= */

function drawBlock(block) {

  ctx.fillStyle =
    block.hp >= 3 ? "#795548" : "#a66a32";

  ctx.fillRect(
    block.x,
    block.y,
    block.w,
    block.h
  );

  ctx.strokeStyle = "#5d4037";
  ctx.lineWidth = 3;

  ctx.strokeRect(
    block.x,
    block.y,
    block.w,
    block.h
  );
}


/* =========================
   DRAW EXTRA BIRDS
========================= */

function drawExtraBirds() {

  for (const bird of game.extraBirds) {
    drawBird(bird);
  }
}


/* =========================
   DRAW REMAINING BIRDS
========================= */

function drawRemainingBirds() {

  let x = 45;

  for (let i = game.birdIndex + 1;
       i < game.birds.length;
       i++) {

    const bird = game.birds[i];

    if (!bird.alive) continue;

    ctx.fillStyle = BIRD_TYPES[bird.type].color;

    ctx.beginPath();

    ctx.arc(
      x,
      570,
      12,
      0,
      Math.PI * 2
    );

    ctx.fill();

    x += 35;
  }
}


/* =========================
   DRAW EVERYTHING
========================= */

function draw() {

  ctx.clearRect(0, 0, W, H);

  drawBackground();

  drawSlingshot();

  for (const block of game.blocks) {
    drawBlock(block);
  }

  for (const pig of game.pigs) {
    drawPig(pig);
  }

  drawExtraBirds();

  if (game.currentBird) {
    drawBird(game.currentBird);
  }

  drawRemainingBirds();
}


/* =========================
   BIRD COLLISION WITH PIG
========================= */

function hitPig(bird) {

  for (const pig of game.pigs) {

    if (!pig.alive) continue;

    const d = distance(
      bird.x,
      bird.y,
      pig.x,
      pig.y
    );

    if (d < bird.radius + pig.radius) {

      pig.alive = false;

      game.score += 100;

      updateUI();
    }
  }
}


/* =========================
   BIRD COLLISION WITH BLOCK
========================= */

function hitBlock(bird) {

  for (const block of game.blocks) {

    if (block.hp <= 0) continue;

    if (
      bird.x + bird.radius > block.x &&
      bird.x - bird.radius < block.x + block.w &&
      bird.y + bird.radius > block.y &&
      bird.y - bird.radius < block.y + block.h
    ) {

      block.hp--;

      game.score += 20;

      // bounce

      bird.vx *= -0.45;
      bird.vy *= -0.45;

      if (block.hp <= 0) {
        game.score += 40;
      }

      updateUI();
    }
  }
}


/* =========================
   UPDATE EXTRA BIRDS
========================= */

function updateExtraBirds() {

  for (let i = game.extraBirds.length - 1;
       i >= 0;
       i--) {

    const bird = game.extraBirds[i];

    bird.vy += game.gravity;

    bird.x += bird.vx;
    bird.y += bird.vy;

    hitPig(bird);
    hitBlock(bird);

    bird.life++;

    if (
      bird.x < -100 ||
      bird.x > W + 100 ||
      bird.y > H + 100 ||
      bird.life > 220
    ) {

      game.extraBirds.splice(i, 1);
    }
  }
}


/* =========================
   UPDATE MAIN BIRD
========================= */

function updateBird() {

  const bird = game.currentBird;

  if (!bird || !bird.launched) return;

  bird.vy += game.gravity;

  bird.x += bird.vx;
  bird.y += bird.vy;

  hitPig(bird);
  hitBlock(bird);

  if (
    bird.x < -100 ||
    bird.x > W + 100 ||
    bird.y > H + 100
  ) {

    bird.alive = false;

    setTimeout(() => {

      if (alivePigs() === 0) {
        winLevel();
      } else {
        nextBird();
      }

    }, 500);
  }

  if (alivePigs() === 0) {
    setTimeout(winLevel, 300);
  }
}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

  if (!game.gameOver) {

    updateBird();

    updateExtraBirds();
  }

  draw();

  requestAnimationFrame(gameLoop);
}


/* =========================
   WIN LEVEL
========================= */

function winLevel() {

  if (game.levelFinished) return;

  game.levelFinished = true;

  if (game.level === 9) {

    showMessage(
      "നീ ഒരു ഭയകരൻ തന്നെ",
      "Play Again"
    );

  } else {

    showMessage(
      "അടുത്തത് നോക്ക് മച്ചു",
      "Next Level"
    );
  }
}


/* =========================
   LOSE
========================= */

function loseGame() {

  if (game.gameOver) return;

  game.gameOver = true;

  showMessage(
    "വെല്ല പണിക്കും പോടാ",
    "Retry"
  );
}


/* =========================
   MESSAGE
========================= */

function showMessage(text, buttonText) {

  message.textContent = text;

  actionBtn.textContent = buttonText;

  messageBox.style.display = "flex";
}


/* =========================
   BUTTON
========================= */

actionBtn.addEventListener("click", function() {

  if (game.levelFinished) {

    if (game.level === 9) {

      game.score = 0;

      loadLevel(0);

    } else {

      loadLevel(game.level + 1);
    }

  } else {

    loadLevel(game.level);
  }

});
      /* =========================
   POINTER POSITION
========================= */

function getPointerPosition(event) {

  const rect = canvas.getBoundingClientRect();

  return {

    x: (event.clientX - rect.left)
       * (canvas.width / rect.width),

    y: (event.clientY - rect.top)
       * (canvas.height / rect.height)
  };
}


/* =========================
   UPDATE POINTER
========================= */

function updatePointer(event) {

  const pos = getPointerPosition(event);

  const bird = game.currentBird;

  if (!bird) return;

  bird.x = clamp(
    pos.x,
    70,
    210
  );

  bird.y = clamp(
    pos.y,
    330,
    520
  );
}


/* =========================
   POINTER DOWN
   WORKS FOR:
   MOBILE TOUCH
   COMPUTER MOUSE
========================= */

canvas.addEventListener(
  "pointerdown",
  function(event) {

    event.preventDefault();

    const bird = game.currentBird;

    if (!bird || game.gameOver || game.levelFinished) {
      return;
    }


    /*
      IMPORTANT:

      If the bird is already flying,
      this pointerdown becomes the ability
      activation.

      This works for:
      👆 Touch
      🖱️ Mouse
    */

    if (bird.launched) {

      useBirdAbility();

      return;
    }


    /*
      Bird is still on slingshot.
      Check whether user touched/clicked
      close enough to the bird.
    */

    const pos = getPointerPosition(event);

    const d = distance(
      pos.x,
      pos.y,
      bird.x,
      bird.y
    );

    if (d < 60) {

      game.dragging = true;

      canvas.setPointerCapture(event.pointerId);

      updatePointer(event);
    }

  },
  { passive: false }
);


/* =========================
   POINTER MOVE
========================= */

canvas.addEventListener(
  "pointermove",
  function(event) {

    event.preventDefault();

    if (!game.dragging) return;

    if (game.currentBird &&
        !game.currentBird.launched) {

      updatePointer(event);
    }

  },
  { passive: false }
);


/* =========================
   POINTER UP
   IMMEDIATE LAUNCH
========================= */

canvas.addEventListener(
  "pointerup",
  function(event) {

    event.preventDefault();

    if (!game.dragging) return;

    game.dragging = false;

    const bird = game.currentBird;

    if (!bird || bird.launched) return;


    /*
      Calculate launch velocity.
    */

    const dx = sling.x - bird.x;
    const dy = sling.y - bird.y;

    const power = 0.17;

    bird.vx = dx * power;
    bird.vy = dy * power;

    bird.launched = true;

    game.launched = true;

    bird.x = sling.x;
    bird.y = sling.y;

    abilityInfo.textContent =
      BIRD_TYPES[bird.type].name +
      " | TAP / CLICK for ability";

  },
  { passive: false }
);


/* =========================
   POINTER CANCEL
========================= */

canvas.addEventListener(
  "pointercancel",
  function(event) {

    event.preventDefault();

    game.dragging = false;

    const bird = game.currentBird;

    if (bird && !bird.launched) {

      bird.x = sling.x;
      bird.y = sling.y;
    }

  },
  { passive: false }
);


/* =========================
   BIRD ABILITY
========================= */

function useBirdAbility() {

  const bird = game.currentBird;

  if (!bird) return;

  if (!bird.launched) return;

  if (bird.abilityUsed) return;

  bird.abilityUsed = true;


  /* =====================
     YELLOW
     SPEED BOOST
  ===================== */

  if (bird.type === "yellow") {

    bird.vx *= 2.0;
    bird.vy *= 2.0;

    abilityInfo.textContent =
      "⚡ SPEED BOOST!";

  }


  /* =====================
     BLUE
     TRIPLE SPLIT
  ===================== */

  else if (bird.type === "blue") {

    const speed = Math.max(
      7,
      Math.hypot(bird.vx, bird.vy)
    );

    const baseAngle =
      Math.atan2(bird.vy, bird.vx);

    /*
      Create two additional birds.
      Original bird + 2 new birds = 3.
    */

    const angles = [
      baseAngle - 0.45,
      baseAngle + 0.45
    ];

    for (const angle of angles) {

      game.extraBirds.push({

        type: "blue",

        x: bird.x,

        y: bird.y,

        radius: 16,

        vx: Math.cos(angle) * speed,

        vy: Math.sin(angle) * speed,

        life: 0,

        launched: true,

        abilityUsed: true,

        alive: true
      });
    }

    /*
      Slow the original slightly
      so the three birds spread out.
    */

    bird.vx *= 0.75;
    bird.vy *= 0.75;

    abilityInfo.textContent =
      "🔵 TRIPLE SPLIT!";
  }


  /* =====================
     BLACK
     EXPLOSION
  ===================== */

  else if (bird.type === "black") {

    const explosionRadius = 125;

    /*
      Destroy pigs near explosion.
    */

    for (const pig of game.pigs) {

      if (!pig.alive) continue;

      const d = distance(
        bird.x,
        bird.y,
        pig.x,
        pig.y
      );

      if (d < explosionRadius) {

        pig.alive = false;

        game.score += 150;
      }
    }


    /*
      Damage blocks near explosion.
    */

    for (const block of game.blocks) {

      if (block.hp <= 0) continue;

      const cx =
        block.x + block.w / 2;

      const cy =
        block.y + block.h / 2;

      const d = distance(
        bird.x,
        bird.y,
        cx,
        cy
      );

      if (d < explosionRadius) {

        block.hp -= 3;

        if (block.hp <= 0) {
          game.score += 50;
        }
      }
    }

    game.score += 100;

    abilityInfo.textContent =
      "💥 BOOM! EXPLOSION!";

    updateUI();
  }


  /* =====================
     RED
     NORMAL
  ===================== */

  else {

    abilityInfo.textContent =
      "🔴 Red Bird has no special ability.";
  }

  updateUI();
}


/* =========================
   KEYBOARD SUPPORT
   SPACE = ABILITY
========================= */

window.addEventListener("keydown", function(event) {

  if (event.code === "Space") {

    event.preventDefault();

    const bird = game.currentBird;

    if (bird && bird.launched) {

      useBirdAbility();
    }
  }
});


/* =========================
   START GAME
========================= */

loadLevel(0);

gameLoop();

</script>
